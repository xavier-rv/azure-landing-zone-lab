name: terraform-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: terraform (fmt, validate, tflint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2

      - name: Detectar ficheros Terraform
        id: detect
        run: |
          if [ -n "$(find . -name '*.tf' -not -path '*/.terraform/*' -print -quit)" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Aun no hay ficheros .tf: se omiten fmt, validate y tflint"
          fi

      - name: terraform fmt
        if: steps.detect.outputs.found == 'true'
        run: terraform fmt -check -recursive -diff

      - name: terraform validate
        if: steps.detect.outputs.found == 'true'
        run: |
          set -euo pipefail
          for dir in $(find . -name '*.tf' -not -path '*/.terraform/*' -exec dirname {} \; | sort -u); do
            echo "::group::validate $dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

      - name: tflint
        if: steps.detect.outputs.found == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config="$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config="$GITHUB_WORKSPACE/.tflint.hcl" --format=compact

  checkov:
    name: checkov (seguridad)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar checkov
        run: pipx install checkov

      - name: checkov
        run: checkov --config-file .checkov.yaml --directory .
